<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recruiter dashboard | HireAI</title><link rel="stylesheet" href="../../assets/css/style.css"><link rel="stylesheet" href="../../assets/css/app.css"></head>
<body><header class="header"><nav class="nav wrap"><a class="logo" href="../../index.html"><b>H</b> Hire<span>AI</span></a><div class="links"><a href="../jobs/jobs.html">Talent pool</a><a class="selected" href="recruiter.html">Dashboard</a></div><div class="actions"><a href="../auth/login.html">Log in</a></div></nav></header>
<main class="wrap page dash-layout"><aside class="dash-side"><a class="active" href="recruiter.html">Overview</a><a href="#openings">Job openings</a><a href="#applicants">Applicants</a></aside><section class="dash-main"><span class="eyebrow">RECRUITER SPACE</span><h1 id="recruiterGreeting">Your hiring dashboard</h1><p id="recruiterMessage" class="muted">Loading your openings…</p><div class="metric-grid"><div class="metric"><strong id="recruiterJobCount">—</strong><small>Your active job posts</small></div><div class="metric"><strong id="recruiterApplicantCount">—</strong><small>Applicants received</small></div><div class="metric"><strong id="recruiterReviewCount">—</strong><small>Need review</small></div></div>
<div class="panel" id="openings"><h2>Post a job</h2><form id="createJobForm" class="tool-form"><label>Role title<input name="title" required maxlength="120" placeholder="e.g. Product Designer"></label><label>Company<input name="company" required maxlength="120" placeholder="Company name"></label><label>Location<input name="location" required maxlength="120" placeholder="Remote or city · work style"></label><div class="field-grid"><label>Job type<select name="type" required><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Internship</option></select></label><label>Category<input name="category" required placeholder="Design, Engineering…"></label></div><label>Salary or range<input name="salary" placeholder="Optional"></label><label>Description<textarea name="description" required rows="5" placeholder="Describe the role and what the person will do"></textarea></label><label>Requirements <span class="muted">One per line</span><textarea name="requirements" rows="3" placeholder="Skills or experience needed"></textarea></label><button class="btn">Publish job</button><p id="jobFormStatus" role="status"></p></form></div>
<div class="panel"><h2>Your openings</h2><div id="recruiterJobs"><p class="muted">Loading…</p></div></div><div class="panel" id="applicants"><h2>Applicants</h2><div id="recruiterApplications"><p class="muted">Loading…</p></div></div></section></main>
<script src="../../assets/js/site-nav.js"></script><script src="../../assets/js/config.js"></script><script src="../../assets/js/api.js"></script><script src="../../assets/js/dashboard.js"></script></body></html>
