<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resume builder | HireAI</title><link rel="stylesheet" href="../../assets/css/style.css"><link rel="stylesheet" href="../../assets/css/app.css"></head><body><header class="header"><nav class="nav wrap"><a class="logo" href="../../index.html"><b>H</b> Hire<span>AI</span></a><div class="links"><a href="../jobs/jobs.html">Find Jobs</a><a href="../dashboard/candidate.html">Dashboard</a></div><div class="actions"><a href="../auth/login.html">Log in</a></div></nav></header><main class="wrap page"><span class="eyebrow">CAREER TOOLKIT</span><h1>Resume builder.</h1><p class="muted">Bring your experience together in a clear, recruiter-friendly format.</p><form class="panel tool-form" id="resumeForm"><label>Your name<input id="name" value="Alex Morgan"></label><label>Professional headline<input id="headline" value="Product Designer"></label><label>Experience and impact<textarea id="experience" placeholder="Describe your role, achievements and measurable impact"></textarea></label><label>Education<textarea id="education" placeholder="Degree, school and graduation year"></textarea></label><button class="btn" type="submit">Preview resume ↗</button></form><article class="panel" id="preview" hidden><span class="eyebrow">RESUME PREVIEW</span><h2 id="previewName"></h2><p id="previewHeadline" class="muted"></p><hr><h3>Experience</h3><p id="previewExperience"></p><h3>Education</h3><p id="previewEducation"></p><button class="btn" onclick="window.print()">Print / save PDF</button></article></main><script>document.getElementById('resumeForm').onsubmit=e=>{e.preventDefault();['name','headline','experience','education'].forEach(x=>document.getElementById('preview'+x[0].toUpperCase()+x.slice(1)).textContent=document.getElementById(x).value||'Add details to complete this section.');document.getElementById('preview').hidden=false;document.getElementById('preview').scrollIntoView({behavior:'smooth'})}</script></body></html>
